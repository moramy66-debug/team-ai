<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--tx:#e8eaf0;--mut:#8b93a5;--ac:#6366f1;--ok:#22c55e;--er:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:820px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
textarea,input,select{width:100%;background:#0f1115;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:#262b36;color:var(--tx)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}
.grow{flex:1 1 150px!important}
.step{border-inline-start:3px solid var(--line);padding:4px 12px;margin:10px 0}
.step.run{border-color:var(--ac)}.step.done{border-color:var(--ok)}.step.err{border-color:var(--er)}
.step b{display:block;font-size:14px}
.tag{display:inline-block;font-size:12px;background:#262b36;color:var(--mut);border-radius:6px;padding:1px 8px;margin-inline-end:6px}
details{margin-top:6px}summary{cursor:pointer;color:var(--mut);font-size:14px}
.out{white-space:pre-wrap;word-wrap:break-word;unicode-bidi:plaintext;font-size:15px}
.final{border-color:var(--ac)}
.hint{color:var(--mut);font-size:13px}
.hist{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.hist:first-of-type{border-top:0}
.bad{color:var(--er)}
#install{display:none}
.chip{font-size:13px;background:#262b36;border-radius:8px;padding:4px 10px;cursor:pointer}
#tmpls button{font-size:13px;padding:6px 12px}
</style>
</head>
<body>
<main>
<header style="flex-wrap:wrap"><h1>Team AI</h1><div class="row"><button id="install" class="sec">تثبيت التطبيق</button><button id="setBtn" class="sec">الإعدادات</button></div></header>

<section id="settings" class="card" hidden>
<h2>مفاتيح الـ API (بتتحفظ على جهازك بس)</h2>
<p class="hint">المفتاح بيتخزن في المتصفح ده وبيتبعت مباشرة لجوجل وGroq. مفيش سيرفر وسيط.</p>
<label>Gemini (من aistudio.google.com/apikey)</label>
<div class="row"><input class="grow" id="k_gemini" type="password" autocomplete="off" placeholder="AIza..."><input class="grow" id="m_gemini" placeholder="الموديل"></div>
<label>GPT-OSS عن طريق Groq (من console.groq.com/keys)</label>
<div class="row"><input class="grow" id="k_groq" type="password" autocomplete="off" placeholder="gsk_..."><input class="grow" id="m_groq" placeholder="الموديل"></div>
<details><summary>إضافة موديلات مدفوعة (اختياري)</summary>
<label>ChatGPT (OpenAI)</label>
<div class="row"><input class="grow" id="k_openai" type="password" autocomplete="off" placeholder="sk-..."><input class="grow" id="m_openai" placeholder="الموديل"></div>
<label>Claude (Anthropic)</label>
<div class="row"><input class="grow" id="k_anthropic" type="password" autocomplete="off" placeholder="sk-ant-..."><input class="grow" id="m_anthropic" placeholder="الموديل"></div>
</details>
<label>تعليمات ثابتة (بتتطبق على كل مهمة)</label>
<textarea id="rules" style="min-height:70px" placeholder="مثال: اكتب ملاحظات الاعتماد بأسلوب رسمي مختصر، ورقم كل ملاحظة"></textarea>
<label>ذاكرة مستوردة (الصق هنا اللي أدوات AI التانية تعرفه عنك)</label>
<textarea id="mem" style="min-height:70px" placeholder="الصق هنا الميموري من ChatGPT أو Claude أو أي أداة تانية"></textarea>
<label>التوقيع (صورة بتظهر آخر الخطابات الرسمية)</label>
<div class="row"><input type="file" id="sigFile" accept="image/*"><button id="sigDel" class="sec">مسح التوقيع</button></div>
<img id="sigPrev" alt="" style="max-height:80px;background:#fff;border-radius:6px;margin-top:6px" hidden>
<div class="row" style="margin-top:12px"><button id="saveBtn">حفظ</button><button id="testBtn" class="sec">اختبار المفاتيح</button><span id="testOut" class="hint"></span></div>
</section>

<section class="card">
<h2>المهمة</h2>
<div id="tmpls" class="row" style="margin-bottom:8px"></div>
<textarea id="task" dir="auto" placeholder="اكتب المهمة هنا..."></textarea>
<div class="row" style="margin-top:8px">
<button id="mic" class="sec">املَى صوت</button>
<button id="attach" class="sec">أرفق ملف أو صورة</button>
<input type="file" id="file" multiple accept="image/*,application/pdf,.txt,.md,.xlsx,.xls,.xlsm,.csv" hidden>
</div>
<div id="chips" class="row" style="margin-top:6px"></div>
<div class="row" style="margin-top:10px">
<label style="margin:0">جولات المراجعة</label>
<select id="rounds" style="width:80px"><option>1</option><option selected>2</option><option>3</option></select>
<button id="go" class="grow">ابدأ</button>
<button id="stop" class="sec" disabled>إيقاف</button>
</div>
<p id="who" class="hint"></p>
</section>

<section id="run" hidden>
<div id="steps"></div>
<div id="finalCard" class="card final" hidden>
<div class="row" style="justify-content:space-between"><h2 style="margin:0">النتيجة النهائية</h2><button id="copy" class="sec">نسخ</button></div>
<div id="final" class="out" style="margin-top:8px"></div>
<div id="xlOut" style="margin-top:10px" hidden><button id="xlDl">تحميل الإكسيل المحسّن</button> <span id="xlNote" class="hint"></span></div>
<div id="sigOut" style="margin-top:10px" hidden><img id="sigImg" alt="" style="max-height:90px;background:#fff;border-radius:6px"></div>
<div class="row" style="margin-top:10px"><input id="follow" class="grow" placeholder="كمل كلام مع الفريق في نفس المهمة..."><button id="sendF" class="sec">ابعت</button></div>
</div>
</section>

<section class="card" id="histCard" hidden><h2>المهام السابقة</h2><div id="hist"></div><button id="clearH" class="sec" style="margin-top:8px">مسح السجل</button></section>
</main>
<script>
const $=id=>document.getElementById(id);
const PROV={
 gemini:{name:'Gemini',model:'gemini-3.5-flash-lite'},
 groq:{name:'GPT-OSS (Groq)',model:'openai/gpt-oss-120b'},
 openai:{name:'ChatGPT',model:'gpt-4o-mini'},
 anthropic:{name:'Claude',model:'claude-sonnet-4-5'}
};
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
let cfg=LS.get('teamai.cfg',{});
{const mig={'gemini-3.8-flash':'gemini-3.5-flash-lite','gemini-2.5-flash':'gemini-3.5-flash-lite','llama-3.3-70b-versatile':'openai/gpt-oss-120b'};
 let dirty=false;
 for(const p in PROV){const m=cfg[p]?.model;if(m&&mig[m]){cfg[p].model=mig[m];dirty=true}}
 if(dirty)LS.set('teamai.cfg',cfg);}
function loadCfg(){for(const p in PROV){$('k_'+p).value=cfg[p]?.key||'';$('m_'+p).value=cfg[p]?.model||PROV[p].model}}
function readCfg(){const c={};for(const p in PROV){c[p]={key:$('k_'+p).value.trim(),model:$('m_'+p).value.trim()||PROV[p].model}}return c}
function agents(){return Object.keys(PROV).filter(p=>cfg[p]?.key).map(p=>({id:p,name:PROV[p].name,model:cfg[p].model||PROV[p].model,key:cfg[p].key}))}
function showWho(){const a=agents();$('who').textContent=a.length?'الفريق: '+a.map(x=>x.name).join(' + '):'ضيف مفاتيح من الإعدادات الأول.';$('go').disabled=!a.length}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let abort=null;
async function post(url,headers,body,signal){
 for(let t=0;t<6;t++){
  const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',...headers},body:JSON.stringify(body),signal});
  if(r.status===429||r.status===503){const w=Math.min(60,5*2**t);await sleep(w*1000);continue}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.error?.message||j.error||r.statusText)+' ['+r.status+']');
  return j;
 }
 throw new Error('الحد المجاني اتعدى، جرب بعد شوية');
}
async function ask(a,system,prompt,json){
 const s=abort?.signal;
 if(a.id==='gemini'){
  const body={contents:[{role:'user',parts:[{text:prompt}]}],systemInstruction:{parts:[{text:system}]}};
  if(json)body.generationConfig={responseMimeType:'application/json'};
  const j=await post(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(a.model)}:generateContent`,{'x-goog-api-key':a.key},body,s);
  return (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('')||'(رد فاضي)';
 }
 if(a.id==='anthropic'){
  const j=await post('https://api.anthropic.com/v1/messages',{'x-api-key':a.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},{model:a.model,max_tokens:4096,system,messages:[{role:'user',content:prompt}]},s);
  return j.content?.map(c=>c.text||'').join('')||'(رد فاضي)';
 }
 const url=a.id==='groq'?'https://api.groq.com/openai/v1/chat/completions':'https://api.openai.com/v1/chat/completions';
 const body={model:a.model,messages:[{role:'system',content:system},{role:'user',content:prompt}]};
 if(json)body.response_format={type:'json_object'};
 const j=await post(url,{authorization:'Bearer '+a.key},body,s);
 return j.choices?.[0]?.message?.content||'(رد فاضي)';
}

const SYS='You are one member of a team of AI models working together on a user task. Reply in the same language as the user task. Be concrete and complete. No filler.';
function sys(){const r=LS.get('teamai.rules','').trim(),m=LS.get('teamai.memory','').trim();let s=SYS;if(r)s+='\nStanding instructions from the user (apply to every task):\n'+r;if(m)s+='\nWhat the user\'s other AI tools remember about him (his imported memory):\n'+m;return s}
function addStep(title,tag){const d=document.createElement('div');d.className='step run';d.innerHTML='<b></b><div class="hint">شغال...</div>';d.querySelector('b').textContent=title;if(tag){const t=document.createElement('span');t.className='tag';t.textContent=tag;d.querySelector('b').prepend(t)}$('steps').appendChild(d);return d}
function doneStep(d,text,err){d.className='step '+(err?'err':'done');const h=d.querySelector('.hint');if(err){h.className='bad';h.textContent=text;return}
 h.remove();const x=document.createElement('details');x.innerHTML='<summary>عرض</summary><div class="out"></div>';x.querySelector('.out').textContent=text;d.appendChild(x)}
async function step(title,a,fn){const d=addStep(title,a.name);try{const r=await fn();doneStep(d,r);return r}catch(e){doneStep(d,e.message||String(e),true);throw e}}
async function stepF(title,a,makeFn){
 try{return await step(title,a,makeFn(a))}
 catch(e){
  const alt=agents().find(x=>x!==a);
  if(!alt)throw e;
  const d=addStep(title+' (اتحول لـ '+alt.name+')',alt.name);
  try{const r=await makeFn(alt)();doneStep(d,r);return r}
  catch(e2){doneStep(d,e2.message||String(e2),true);throw e2}
 }
}

async function askFiles(a,system,prompt,files){
 const s=abort?.signal;
 const parts=files.map(f=>({inlineData:{mimeType:f.mime,data:f.b64}}));
 parts.push({text:prompt});
 const body={contents:[{role:'user',parts}],systemInstruction:{parts:[{text:system}]}};
 const j=await post(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(a.model)}:generateContent`,{'x-goog-api-key':a.key},body,s);
 return (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('')||'(رد فاضي)';
}
let current=null,lastEnriched='';
async function runTask(task,rounds){
 const A=agents(),N=A.length,lead=A[0],log=[];
 // 0 attachments
 if(files.length){
  const ga=A.find(a=>a.id==='gemini');
  if(files.some(f=>!f.xl)&&!ga)throw new Error('رفع الملفات محتاج مفتاح Gemini في الإعدادات');
  const descs=[];
  for(const f of files){
   if(f.xl){descs.push('### '+f.name+' (Excel workbook)\n'+f.text);xlCtx={name:f.name,wb:f.wb,text:f.text};continue}
   const d=await step('قراءة المرفقات: '+f.name,ga,()=>askFiles(ga,sys(),'Describe in detail, in Arabic, everything in this attached file "'+f.name+'": any drawings, dimensions, levels, pipe sizes, item lists, quantities, prices, texts, tables and notes. Be thorough, structured and exact with numbers, so another AI model that cannot see the file can work from your description alone.',[f]));
   descs.push('### '+f.name+'\n'+d);
  }
  task=task+'\n\nوصف المرفقات (من فريقك اللي شافها):\n'+descs.join('\n\n');
 }
 lastEnriched=task;
 // 1 plan
 let parts;
 if(N===1){parts=[{title:'المهمة كاملة',instruction:task}]}
 else{
  const raw=await stepF('تقسيم المهمة',lead,x=>()=>ask(x,sys(),`Split this task into exactly ${N} parts that can be worked on in parallel by ${N} different AI models. Each part must be self-contained and together they must cover the whole task. Return JSON only: {"parts":[{"title":"...","instruction":"full instruction for this part"}]}\n\nTASK:\n${task}`,true));
  try{const m=raw.match(/\{[\s\S]*\}/);parts=JSON.parse(m[0]).parts}catch{parts=null}
  if(!Array.isArray(parts)||parts.length<N){parts=A.map((_,i)=>({title:'جزء '+(i+1),instruction:`Work on part ${i+1} of ${N} of this task, covering a distinct portion of it:\n${task}`}))}
  parts=parts.slice(0,N);
 }
 // 2 draft (parallel)
 let drafts=await Promise.all(A.map((a,i)=>stepF('الصياغة الأولى: '+parts[i].title,a,x=>()=>ask(x,sys(),`Overall task:\n${task}\n\nYour part: ${parts[i].title}\n${parts[i].instruction}\n\nWrite your part.`))));
 // 3 review rounds
 if(N>1)for(let r=1;r<=rounds;r++){
  const crit=await Promise.all(A.map((a,i)=>{const j=(i+1)%N;return stepF(`مراجعة (جولة ${r}): ${a.name} يراجع ${A[j].name}`,a,x=>()=>ask(x,sys(),`Overall task:\n${task}\n\nReview this work by a teammate on part "${parts[j].title}". List concrete problems, errors, gaps and improvements. If it is already excellent, say so briefly.\n\nWORK:\n${drafts[j]}`))}));
  drafts=await Promise.all(A.map((a,i)=>{const c=crit[(i-1+N)%N];return stepF(`تحسين (جولة ${r}): ${parts[i].title}`,a,x=>()=>ask(x,sys(),`Overall task:\n${task}\n\nYour part: ${parts[i].title}\n\nYour current version:\n${drafts[i]}\n\nReview from a teammate:\n${c}\n\nRewrite your part, fixing valid points and ignoring invalid ones. Output only the improved part.`))}));
 }
 // 4 merge
 const final=N===1?drafts[0]:await stepF('الدمج النهائي',lead,x=>()=>ask(x,sys(),`Overall task:\n${task}\n\nCombine these parts from the team into one coherent, polished final answer. Remove duplication, fix inconsistencies, keep everything valuable. Output only the final answer.\n\n`+drafts.map((d,i)=>`### ${parts[i].title}\n${d}`).join('\n\n')));
 return final;
}

$('go').onclick=()=>startRun($('task').value.trim(),false);
async function startRun(task,followUp){
 if(!task||!agents().length)return;
 if(!followUp){xlCtx=null;$('xlOut').hidden=true;$('run').hidden=false;$('steps').innerHTML='';$('finalCard').hidden=true;current={id:Date.now(),t:Date.now(),task,enriched:''}}
 abort=new AbortController();$('go').disabled=true;$('stop').disabled=false;$('sendF').disabled=true;
 try{const f=await runTask(task,+$('rounds').value);$('final').textContent=f;$('finalCard').hidden=false;showSig();
  if(xlCtx){try{await makeXl(f)}catch(e2){if(e2.name!=='AbortError'){$('xlNote').textContent='الإكسيل المحسّن: '+e2.message;$('xlOut').hidden=false;$('xlDl').hidden=true}}}
  if(current){current.enriched=lastEnriched;saveCurrent()}
  $('finalCard').scrollIntoView({behavior:'smooth'})}
 catch(e){if(e.name==='AbortError'){}}
 finally{$('go').disabled=false;$('stop').disabled=true;$('sendF').disabled=false;abort=null}
}
$('sendF').onclick=()=>{
 const f=$('follow').value.trim();if(!f||!current)return;
 $('follow').value='';
 const d=document.createElement('div');d.className='step done';const b=document.createElement('b');b.textContent='أنت: '+f;d.appendChild(b);$('steps').appendChild(d);
 const base=current.enriched||current.task;
 startRun('السياق - المهمة الأصلية:\n'+base+'\n\nالنتيجة الحالية من الفريق:\n'+$('final').textContent+'\n\nطلب متابعة من المستخدم على نفس الشغل:\n'+f,true);
};
function isLetter(t){return /خطاب|رسالة رسمية|formal letter/i.test(t||'')}
function showSig(){const sg=LS.get('teamai.sig','');const on=!!sg&&current&&isLetter(current.task);$('sigOut').hidden=!on;if(on)$('sigImg').src=sg}
function showSigPrev(){const sg=LS.get('teamai.sig','');$('sigPrev').hidden=!sg;if(sg)$('sigPrev').src=sg;$('sigDel').hidden=!sg}
$('sigFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,500/im.width);const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);LS.set('teamai.sig',c.toDataURL('image/jpeg',0.85));showSigPrev();showSig();$('testOut').textContent='التوقيع اتحفظ ✔'};im.src=r.result};r.readAsDataURL(f)};
$('sigDel').onclick=()=>{localStorage.removeItem('teamai.sig');showSigPrev();showSig()};
showSigPrev();

let files=[],xlCtx=null;
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('تعذر تحميل مكتبة الإكسيل (محتاج نت)'));document.head.appendChild(sc)})}
function sheetsText(wb){let out='',left=60000;for(const n of wb.SheetNames){const ws=wb.Sheets[n];if(!ws||!ws['!ref'])continue;const rg=XLSX.utils.decode_range(ws['!ref']);let t='## Sheet: '+n+' (range '+ws['!ref']+')\n';
 for(let r=rg.s.r;r<=rg.e.r;r++){const cells=[];for(let c=rg.s.c;c<=rg.e.c;c++){const ad=XLSX.utils.encode_cell({r,c}),cl=ws[ad];if(!cl||(cl.v==null&&!cl.f))continue;cells.push(ad+'='+(cl.f?'['+'='+cl.f+'] -> ':'')+(cl.v==null?'':String(cl.v)))}
  if(cells.length)t+=cells.join(' | ')+'\n';if(t.length>left){t+='...(اتقص: الشيت كبير)\n';break}}
 left-=t.length;out+=t+'\n';if(left<=0)break}return out}
function recalc(wb){
 const cache={};let miss=0;
 const val=(sh,ad)=>{const k=sh+'!'+ad;if(k in cache)return cache[k];const ws=wb.Sheets[sh];const cl=ws&&ws[ad];if(!cl)return cache[k]=0;
  if(cl.f){cache[k]=0;let v;try{v=evalF(sh,cl.f)}catch{v=undefined}if(v===undefined||(typeof v==='number'&&!isFinite(v))){v=cl.v!==undefined?cl.v:0;miss++}cl.v=v;cl.t=typeof v==='number'?'n':typeof v==='boolean'?'b':'s';delete cl.w;return cache[k]=v}
  return cache[k]=cl.v===undefined?0:cl.v};
 const rng=(sh,a,b)=>{const r=XLSX.utils.decode_range(a+':'+b),o=[];for(let i=r.s.r;i<=r.e.r;i++)for(let j=r.s.c;j<=r.e.c;j++)o.push(val(sh,XLSX.utils.encode_cell({r:i,c:j})));return o};
 const nums=a=>a.flat(9).filter(x=>typeof x==='number');
 const F={SUM:(...a)=>nums(a).reduce((x,y)=>x+y,0),AVERAGE:(...a)=>{const n=nums(a);return n.reduce((x,y)=>x+y,0)/n.length},MIN:(...a)=>Math.min(...nums(a)),MAX:(...a)=>Math.max(...nums(a)),ROUND:(x,d=0)=>Math.round(x*10**d)/10**d,ABS:Math.abs,COUNT:(...a)=>nums(a).length,IF:(c,x,y)=>c?x:y,SQRT:Math.sqrt};
 function evalF(sh,f){
  let e=f.replace(/"[^"]*"/g,m=>JSON.stringify(m.slice(1,-1)));
  e=e.replace(/(?:'([^']+)'|([A-Za-z_][\w.]*))?!?\$?([A-Z]{1,3})\$?(\d+):\$?([A-Z]{1,3})\$?(\d+)/g,(m,q,u,c1,r1,c2,r2)=>{const n=q||(m.includes('!')?u:null)||sh;return 'R('+JSON.stringify(n)+',"'+c1+r1+'","'+c2+r2+'")'});
  e=e.replace(/(^|[^\w"$.])(?:'([^']+)'!|([A-Za-z_]\w*)!)?\$?([A-Z]{1,3})\$?(\d+)(?![\w(])/g,(m,pre,q,u,c,r)=>pre+'V('+JSON.stringify(q||u||sh)+',"'+c+r+'")');
  e=e.replace(/\b([A-Z]{2,})\(/g,(m,n)=>{if(!F[n])throw new Error('fn '+n);return 'F.'+n+'('}).replace(/\^/g,'**').replace(/<>/g,'!==').replace(/([^<>!=])=(?!=)/g,'$1==').replace(/(\d)%/g,'($1/100)').replace(/&/g,'+');
  return new Function('R','V','F','return ('+e+')')((a,b,c)=>rng(a,b,c),val,F)}
 for(const sh of wb.SheetNames){const ws=wb.Sheets[sh];for(const ad of Object.keys(ws)){if(ad[0]==='!')continue;if(ws[ad]&&ws[ad].f)val(sh,ad)}}
 return miss}
function applyEdits(wb,edits){let n=0;for(const e of edits||[]){const ws=wb.Sheets[e.sheet]||wb.Sheets[wb.SheetNames[0]];if(!ws||!e.cell||!/^[A-Z]{1,3}[0-9]{1,6}$/.test(e.cell))continue;
 let cl;if(typeof e.formula==='string'&&e.formula.trim())cl={t:'n',f:e.formula.trim().replace(/^=/,'')};else if(e.value!==undefined&&e.value!==null)cl=typeof e.value==='number'?{t:'n',v:e.value}:{t:'s',v:String(e.value)};else continue;
 ws[e.cell]=cl;const a=XLSX.utils.decode_cell(e.cell),rg=ws['!ref']?XLSX.utils.decode_range(ws['!ref']):{s:a,e:a};rg.s.r=Math.min(rg.s.r,a.r);rg.s.c=Math.min(rg.s.c,a.c);rg.e.r=Math.max(rg.e.r,a.r);rg.e.c=Math.max(rg.e.c,a.c);ws['!ref']=XLSX.utils.encode_range(rg);n++}
 wb.Workbook=wb.Workbook||{};wb.Workbook.CalcPr={fullCalcOnLoad:true};try{recalc(wb)}catch{}return n}
async function makeXl(final){const A=agents(),lead=A[0];
 const sheets=sheetsText(xlCtx.wb);
 const raw=await stepF('تجهيز الإكسيل المحسّن',lead,x=>()=>ask(x,sys(),'You are editing an Excel workbook according to the team review below. Current workbook content (cell=[=formula] -> value):\n'+sheets+'\n\nTeam review and conclusions:\n'+final+'\n\nReturn ONLY a JSON object: {"edits":[{"sheet":"SheetName","cell":"B5","formula":"=SUM(B1:B4)"} or {"sheet":"SheetName","cell":"C7","value":123}],"summary":"short Arabic summary of what changed"}. Include only cells that must change to fix errors or apply the agreed improvements. Prefer formulas over typed numbers where the cell is a calculation. Use English function names and comma separators.',true));
 let j;try{j=JSON.parse(raw.match(/\{[\s\S]*\}/)[0])}catch{j=null}
 if(!j||!Array.isArray(j.edits))throw new Error('مقدرتش أطلع تعديلات الإكسيل');
 const n=applyEdits(xlCtx.wb,j.edits);xlCtx.text=sheetsText(xlCtx.wb);xlCtx.count=(xlCtx.count||0)+n;
 $('xlNote').textContent=n+' تعديل'+(j.summary?' - '+j.summary:'');$('xlDl').hidden=false;$('xlOut').hidden=false}
$('xlDl').onclick=()=>{if(xlCtx)XLSX.writeFile(xlCtx.wb,xlCtx.name.replace(/\.[^.]+$/,'')+'-improved.xlsx',{bookType:'xlsx'})};
$('attach').onclick=()=>$('file').click();
$('file').onchange=async e=>{
 for(const f of e.target.files){
  if(f.size>12*1024*1024){alert(f.name+' أكبر من 12 ميجا');continue}
  if(/\.(xlsx|xlsm|xls|csv)$/i.test(f.name)){
   try{await loadXLSX();const wb=XLSX.read(await f.arrayBuffer(),{cellFormula:true,cellNF:true,cellStyles:true});
    files.push({name:f.name,mime:'xl',xl:true,wb,text:sheetsText(wb),macro:/\.xlsm$/i.test(f.name)})}
   catch(err){alert('مقدرتش أقرا '+f.name+': '+err.message)}
   continue}
  const b64=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(f)});
  files.push({name:f.name,mime:f.type||'application/octet-stream',b64});
 }
 e.target.value='';renderChips();
};
function renderChips(){$('chips').innerHTML='';files.forEach((f,i)=>{const s=document.createElement('span');s.className='chip';s.textContent=f.name+' ✕';s.title='اضغط للمسح';s.onclick=()=>{files.splice(i,1);renderChips()};$('chips').appendChild(s)})}

{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
