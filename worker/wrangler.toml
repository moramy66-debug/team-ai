name = "team-ai-api-proxy"
main = "api-proxy.js"
compatibility_date = "2026-01-01"

[vars]
# Restricted to the Team AI Pages origin. Change only if you host the app elsewhere.
ALLOWED_ORIGIN = "https://moramy66-debug.github.io"

# Store API keys securely as Wrangler secrets (do not put keys in this file):
